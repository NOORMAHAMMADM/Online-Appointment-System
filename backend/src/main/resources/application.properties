server.port=${PORT:8080}

# Database Configuration
# Defaults to embedded H2 if DB_URL is not set, so Render deployments never crash.
# Supports MySQL, PostgreSQL, or H2 when DB_URL is provided.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/appointment_db;DB_CLOSE_DELAY=-1;AUTO_RECONNECT=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Connection pool settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# H2 Console (optional)
spring.h2.console.enabled=false

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:5175,https://*.vercel.app}